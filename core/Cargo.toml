[workspace]
members = [
    "crates/assistant-ipc",
    "crates/domain",
    "crates/vela-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
assistant-ipc = { path = "crates/assistant-ipc" }
domain = { path = "crates/domain" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.43"
