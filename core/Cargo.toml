[workspace]
members = [
    "crates/acp-runtime",
    "crates/assistant-ipc",
    "crates/domain",
    "crates/harness-discovery",
    "crates/permission-broker",
    "crates/vela-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
acp-runtime = { path = "crates/acp-runtime" }
agent-client-protocol = "=2.0.0"
assistant-ipc = { path = "crates/assistant-ipc" }
async-process = "2.5.0"
domain = { path = "crates/domain" }
futures = "0.3.31"
harness-discovery = { path = "crates/harness-discovery" }
permission-broker = { path = "crates/permission-broker" }
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.43"
