name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: macos-15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  swift:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: swift build --product VelaApp

  ipc-integration:
    runs-on: macos-15
    needs: [rust, swift]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo build --manifest-path core/Cargo.toml --workspace
      - run: swift test --package-path app
        env:
          VELA_CORE_PATH: ${{ github.workspace }}/core/target/debug/vela-core
